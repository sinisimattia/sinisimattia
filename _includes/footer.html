<footer class="section footer">
	<div class="container">
		<div>
			<h2 class="title">Let's connect 💡</h2>
			<ul class="mt-3">
				{%- for link in site.data.contact %}
				<li><a class="has-text-weight-semibold" href="{{ link.url }}">{{ link.name }}</a></li>
				{%- endfor %}
			</ul>
		</div>
		<p>Copyright &copy; <strong>{{ site.author.name }}</strong></p>
	</div>
</footer>
