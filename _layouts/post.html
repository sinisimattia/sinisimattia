---
layout: default
---
<article class="content article">
	<h1 class="title">{{ page.title }}</h1>
	{% if page.subtitle %}<p class="article-subtitle">{{ page.subtitle }}</p>{% endif %}
	{% include post-meta.html post=page %}
	{% if page.header.image %}<img class="article-image" src="{{ page.header.image }}" alt="{{ page.title }}">{% endif %}
	<div class="article-body">{{ content }}</div>
	{% include further-reading.html post=page %}
	<p class="article-back"><a href="{{ '/blog' | relative_url }}">← All articles</a></p>
</article>
