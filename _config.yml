# Site
title: "The Push"
description: "Thoughts on programming, open source, and the things I'm experimenting with."
url: "https://snisni.it"
lang: en
author:
  name: "Mattia Sinisi"
  nickname: "SNISNI"
permalink: /blog/:slug/

# Separator placed between the page title and the site title in the <title> tag
title_separator: " — "

# Plugins
plugins:
  - jekyll-feed
  - jekyll-seo-tag

# Default front matter
defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post
