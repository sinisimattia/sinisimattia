<body>
	<header class="section container banner">
		<small>Mattia Sinisi a.k.a.</small>
		<h1 class="title">SNISNI</h1>
		<summary class="subtitle">Full-Stack Web Developer, Artist, Photographer & Blogger</summary>
		<span class="is-sr-only">Mattia Sinisi —
			Full-Stack Web Developer</span>
	</header>

	<main class="section container">
		<section x-data="{ work: work }">
			<h2 class="title">Work</h2>
			<div class="columns">
				<template x-for="group in work" :key="group.title">
					<div class="column">
						<div class="skill-card">
							<h3 class="skill-card-title" x-text="group.title"></h3>
							<ul class="skill-list">
								<template x-for="skill in group.skills" :key="skill.name">
									<li>
										<span class="skill-emoji" x-text="skill.emoji"></span>
										<span class="tag" x-text="skill.name"></span>
										<template x-if="skill.description">
											<span class="skill-descr" x-text="skill.description"></span>
										</template>
									</li>
								</template>
							</ul>
						</div>
					</div>
				</template>
			</div>
		</section>

		<section x-data="{ extras: extras }">
			<h2 class="title">Extras</h2>

			<div class="columns">
				<template x-for="card in extras" :key="card.title">
					<div class="column">
						<div class="brand-card" x-bind:class="card.variant">
							<div class="card-body">
								<div class="card-emoji" x-text="card.emoji"></div>
								<p class="eyebrow" x-text="card.eyebrow"></p>
								<h3 class="card-title" x-text="card.title"></h3>
								<p x-text="card.description"></p>
							</div>

							<!-- Card with a single call-to-action link -->
							<template x-if="card.cta">
								<a class="pill" x-bind:class="{ 'is-solid': card.cta.solid }" x-bind:href="card.cta.url"
									target="_blank" rel="noopener" x-text="card.cta.label"></a>
							</template>

							<!-- Card with a list of links -->
							<template x-if="card.links">
								<ul class="pill-list">
									<template x-for="link in card.links" :key="link.url">
										<li>
											<a class="pill" x-bind:href="link.url" target="_blank" rel="noopener"
												x-text="link.name"></a>
										</li>
									</template>
								</ul>
							</template>
						</div>
					</div>
				</template>
			</div>
		</section>
	</main>

	<footer class="section footer">
		<div class="container">
			<div>
				<h2 class="title">Let's connect 💡</h2>
				<ul class="mt-3" x-data="{links: contactLinks}">
					<template x-for="link in links">
						<li>
							<a x-bind:href="link.url" x-text="link.name" target="_blank"
								class="has-text-weight-semibold" />
						</li>
					</template>
				</ul>
			</div>

			<p>Copyright &copy; <strong>Mattia Sinisi</strong></p>
		</div>
	</footer>
